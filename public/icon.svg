<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <!-- Crescent Moon Symbol (은달) -->
  <path d="M 330 140 C 240 140 170 210 170 300 C 170 370 215 425 280 445 C 210 440 150 380 150 305 C 150 220 220 150 305 150 C 314 150 322 151 330 152 Z" fill="url(#moonGrad)" />
  <!-- Star accents -->
  <circle cx="340" cy="180" r="10" fill="#fef08a" />
  <circle cx="380" cy="230" r="6" fill="#fef08a" />
  <circle cx="310" cy="260" r="4" fill="#fef08a" />
  <!-- Steam lines above coffee -->
  <path d="M 230 360 Q 240 330 230 310" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <path d="M 260 360 Q 270 330 260 310" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 290 360 Q 300 330 290 310" fill="none" stroke="#fed7aa" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <!-- Text Eundal Cafe -->
  <text x="256" y="465" font-family="'Noto Sans KR', sans-serif" font-size="34" font-weight="900" fill="#fef3c7" text-anchor="middle" letter-spacing="4">은달 카페</text>
</svg>
